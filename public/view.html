<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fonte OBS</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  body.transparent { background: transparent; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; background: transparent; }
  body.contain video { object-fit: contain; }
  #debug { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,.6); color: #fff; font: 12px/1.5 monospace; padding: 6px 10px; border-radius: 6px; display: none; white-space: pre; }
  body.debug #debug { display: block; }
  #nosignal { position: fixed; inset: 0; display: none; place-items: center; color: #889; font-size: 28px; background: #000; }
  body.show-nosignal #nosignal { display: grid; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="nosignal"></div>
<div id="debug"></div>
<script src="/common.js"></script>
<script src="/view.js"></script>
</body>
</html>
