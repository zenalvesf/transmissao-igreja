<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  :root {
    --accent: #4f8cff;
    --card: rgba(12, 14, 20, .82);
    --text: #fff;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --scale: 1;
  }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: var(--font); color: var(--text); }
  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* ---- Legenda inferior (nome + função) ---- */
  #lower { position: absolute; left: 80px; bottom: 120px; display: flex; align-items: stretch; transform: translateX(-120%); opacity: 0; transition: transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  #lower.show { transform: none; opacity: 1; }
  #lower .bar { width: 10px; background: var(--accent); border-radius: 6px 0 0 6px; }
  #lower .box { background: var(--card); padding: 18px 34px 18px 26px; border-radius: 0 10px 10px 0; backdrop-filter: blur(8px); }
  #lower .title { font-size: 44px; font-weight: 700; line-height: 1.1; }
  #lower .subtitle { font-size: 26px; opacity: .85; margin-top: 4px; }
  #lower .subtitle:empty { display: none; }

  /* ---- Versículo ---- */
  #verse { position: absolute; left: 50%; bottom: 110px; transform: translate(-50%, 40px); width: 1400px; max-width: 90%; opacity: 0; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; }
  #verse.show { transform: translate(-50%, 0); opacity: 1; }
  #verse .box { background: var(--card); border-left: 10px solid var(--accent); border-radius: 12px; padding: 26px 40px; backdrop-filter: blur(8px); }
  #verse .text { font-size: 38px; line-height: 1.3; font-weight: 500; }
  #verse .ref { font-size: 26px; margin-top: 12px; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
  #verse.long .text { font-size: 30px; }

  /* ---- Aviso rolante ---- */
  #ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--card); border-top: 4px solid var(--accent); display: flex; align-items: center; transform: translateY(100%); transition: transform .45s; overflow: hidden; }
  #ticker.show { transform: none; }
  #ticker .label { background: var(--accent); height: 100%; display: flex; align-items: center; padding: 0 28px; font-weight: 800; font-size: 24px; letter-spacing: .06em; flex: none; }
  #ticker .track { flex: 1; overflow: hidden; white-space: nowrap; }
  #ticker .text { display: inline-block; padding-left: 100%; font-size: 28px; animation: scroll linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }

  /* ---- Contagem regressiva ---- */
  #countdown { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .5s; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.7)); }
  #countdown.show { opacity: 1; }
  #countdown .inner { text-align: center; }
  #countdown .time { font-size: 220px; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  #countdown .msg { font-size: 52px; margin-top: 24px; opacity: .9; }

  /* ---- Título central ---- */
  #title { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); opacity: 0; transition: opacity .5s, transform .5s; text-align: center; max-width: 85%; }
  #title.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #title .text { font-size: 110px; font-weight: 800; line-height: 1.05; text-shadow: 0 8px 50px rgba(0,0,0,.7); }
  #title .line { width: 240px; height: 8px; background: var(--accent); margin: 28px auto 0; border-radius: 4px; }

  /* ---- Estilos do tema (classico é o padrão acima) ---- */
  body.estilo-moderno #lower .box, body.estilo-moderno #verse .box, body.estilo-moderno #lyrics .box, body.estilo-moderno #cartao .inner { border-radius: 0; backdrop-filter: none; background: rgba(8, 10, 14, .9); }
  body.estilo-moderno #lower .bar { width: 16px; border-radius: 0; }
  body.estilo-moderno #lower .title { text-transform: uppercase; letter-spacing: .04em; font-size: 40px; }
  body.estilo-moderno #lower .subtitle { color: var(--accent); font-weight: 600; opacity: 1; }
  body.estilo-moderno #ticker { border-top-width: 6px; }
  body.estilo-moderno #title .line { width: 100%; height: 6px; }
  body.estilo-arredondado #lower .bar { display: none; }
  body.estilo-arredondado #lower .box { border-radius: 999px; padding: 18px 44px; border: 3px solid var(--accent); }
  body.estilo-arredondado #verse .box { border-left: 0; border: 3px solid var(--accent); border-radius: 28px; }
  body.estilo-arredondado #ticker { border-top: 0; margin: 0 24px 16px; border-radius: 999px; overflow: hidden; }
  body.estilo-arredondado #ticker { transform: translateY(calc(100% + 24px)); } body.estilo-arredondado #ticker.show { transform: none; }
  body.estilo-arredondado #ticker .label { border-radius: 999px 0 0 999px; }
  body.estilo-arredondado #lyrics .box, body.estilo-arredondado #legenda .box { border-radius: 28px; }
  body.estilo-arredondado #lyrics.faixa .box { border-radius: 0; }
  /* legenda inferior centralizada */
  body.lower-centro #lower { left: 50%; transform: translate(-50%, 60px); }
  body.lower-centro #lower.show { transform: translate(-50%, 0); }
  body.lower-centro #lower .box { text-align: center; }

  /* ---- Cantos: logo, QR e relógio ---- */
  .canto { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0; transition: opacity .4s; }
  .canto.show { opacity: 1; }
  .canto.esq-cima { left: 60px; top: 50px; } .canto.dir-cima { right: 60px; top: 50px; }
  .canto.esq-baixo { left: 60px; bottom: 60px; } .canto.dir-baixo { right: 60px; bottom: 60px; }
  #logo img { display: block; max-width: 100%; filter: drop-shadow(0 4px 14px rgba(0,0,0,.5)); }
  #qr { background: #fff; color: #111; padding: 14px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #qr img { display: block; }
  #qr .rotulo { font-size: 22px; font-weight: 700; text-align: center; max-width: 100%; color: #111; }
  #qr .rotulo:empty { display: none; }
  #relogio { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--card); padding: 8px 22px; border-radius: 12px; backdrop-filter: blur(8px); border-bottom: 4px solid var(--accent); }

  /* ---- Cartão em tela cheia ---- */
  #cartao { position: absolute; inset: 0; opacity: 0; transition: opacity .5s; display: grid; place-items: center; }
  #cartao.show { opacity: 1; }
  #cartao .bg { position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), #0b0d12 70%); }
  #cartao .bg.img { background-size: cover; background-position: center; }
  #cartao .inner { position: relative; text-align: center; max-width: 80%; padding: 48px 72px; border-radius: 24px; background: rgba(8, 10, 14, .55); backdrop-filter: blur(10px); transform: translateY(24px); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #cartao.show .inner { transform: none; }
  #cartao .inner:has(.titulo:empty):has(.texto:empty) { display: none; }
  #cartao .titulo { font-size: 96px; font-weight: 800; line-height: 1.05; text-shadow: 0 6px 40px rgba(0,0,0,.6); }
  #cartao .titulo:empty { display: none; }
  #cartao .texto { font-size: 44px; line-height: 1.3; margin-top: 24px; white-space: pre-line; opacity: .95; }
  #cartao .texto:empty { display: none; }
  #cartao.long .titulo { font-size: 72px; } #cartao.long .texto { font-size: 36px; }

  /* ---- Legenda traduzida (tradução ao vivo) ---- */
  #legenda { position: absolute; left: 0; right: 0; bottom: 40px; display: flex; justify-content: center; opacity: 0; transition: opacity .3s, bottom .4s; padding: 0 80px; }
  #legenda.show { opacity: 1; }
  #legenda .box { max-width: 1500px; background: rgba(0,0,0,.72); padding: 12px 28px; border-radius: 12px; font-size: 40px; font-weight: 600; line-height: 1.25; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #legenda.long .box { font-size: 32px; }
  #legenda.with-lyrics { bottom: 270px; }
  #legenda.with-lower { bottom: 290px; }

  /* ---- Letra do Holyrics ---- */
  #lyrics { position: absolute; left: 0; right: 0; bottom: 90px; display: flex; justify-content: center; opacity: 0; transform: translateY(30px); transition: opacity .35s, transform .4s cubic-bezier(.2,.8,.2,1); }
  #lyrics.superior { bottom: auto; top: 70px; transform: translateY(-30px); }
  #lyrics.show { opacity: 1; transform: none; }
  #lyrics.inferior.with-lower { bottom: 260px; }
  #lyrics .box { max-width: 1500px; text-align: center; padding: 20px 48px; border-radius: 16px; }
  #lyrics .title { font-size: 26px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin-bottom: 8px; }
  #lyrics .title:empty { display: none; }
  #lyrics .text { font-size: 48px; font-weight: 600; line-height: 1.25; white-space: pre-line; text-shadow: 0 3px 16px rgba(0,0,0,.7); }
  #lyrics.P .text { font-size: 38px; } #lyrics.G .text { font-size: 60px; }
  #lyrics.long .text { font-size: 38px; } #lyrics.long.G .text { font-size: 46px; } #lyrics.long.P .text { font-size: 32px; }
  #lyrics.maiusculas .text { text-transform: uppercase; }
  #lyrics.faixa .box { width: 100%; max-width: none; border-radius: 0; background: var(--card); backdrop-filter: blur(8px); border-top: 4px solid var(--accent); }
  #lyrics.superior.faixa .box { border-top: 0; border-bottom: 4px solid var(--accent); }
  #lyrics.caixa .box { background: var(--card); backdrop-filter: blur(8px); border-left: 10px solid var(--accent); }
  #lyrics.sombra .text { text-shadow: 0 0 6px #000, 0 4px 24px rgba(0,0,0,.95); }

  body.scaled .layer { transform-origin: 0 0; }
</style>
</head>
<body>
<div class="layer">
  <div id="lower"><div class="bar"></div><div class="box"><div class="title"></div><div class="subtitle"></div></div></div>
  <div id="verse"><div class="box"><div class="text"></div><div class="ref"></div></div></div>
  <div id="ticker"><div class="label">AVISO</div><div class="track"><span class="text"></span></div></div>
  <div id="countdown"><div class="inner"><div class="time">00:00</div><div class="msg"></div></div></div>
  <div id="title"><div class="text"></div><div class="line"></div></div>
  <div id="lyrics" class="inferior faixa M"><div class="box"><div class="title"></div><div class="text"></div></div></div>
  <div id="legenda"><div class="box"></div></div>
  <div id="cartao"><div class="bg"></div><div class="inner"><div class="titulo"></div><div class="texto"></div></div></div>
  <div id="logo" class="canto dir-cima"><img alt=""></div>
  <div id="qr" class="canto dir-baixo"><img alt="QR"><div class="rotulo"></div></div>
  <div id="relogio" class="canto esq-cima">00:00</div>
</div>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  const { Hub, $ } = window.TI;
  const params = new URLSearchParams(location.search);
  if (params.get('accent')) document.documentElement.style.setProperty('--accent', '#' + params.get('accent').replace('#', ''));
  if (params.get('font')) document.documentElement.style.setProperty('--font', params.get('font'));

  // Ajusta a escala quando a fonte do OBS não for 1920 de largura
  function fitScale() {
    const s = window.innerWidth / 1920;
    const layer = document.querySelector('.layer');
    layer.style.transform = `scale(${s})`;
    layer.style.width = '1920px'; layer.style.height = (window.innerHeight / s) + 'px';
    document.body.classList.add('scaled');
  }
  fitScale(); window.addEventListener('resize', fitScale);

  const lower = $('#lower'), verse = $('#verse'), ticker = $('#ticker'), countdown = $('#countdown'), title = $('#title'), lyrics = $('#lyrics'), legenda = $('#legenda'), cartao = $('#cartao'), logo = $('#logo'), qr = $('#qr'), relogio = $('#relogio');
  let relogioCfg = { visible: false, formato: '24h' }, qrTexto = '', qrTam = 0;
  function canto(elm, c) { elm.className = 'canto ' + (['esq-cima', 'dir-cima', 'esq-baixo', 'dir-baixo'].includes(c) ? c : 'dir-cima') + (elm.classList.contains('show') ? ' show' : ''); }
  let cd = { visible: false, target: 0, message: '' };

  function apply(o) {
    if (o.tema) { // cor, fonte e estilo vindos da mesa; a URL (?accent= / ?font=) ainda manda se foi usada
      const t = o.tema;
      if (!params.get('accent') && t.cor) document.documentElement.style.setProperty('--accent', t.cor);
      if (!params.get('font') && t.fonte) document.documentElement.style.setProperty('--font', `"${t.fonte}", "Segoe UI", system-ui, sans-serif`);
      document.body.classList.toggle('estilo-moderno', t.estilo === 'moderno');
      document.body.classList.toggle('estilo-arredondado', t.estilo === 'arredondado');
      document.body.classList.toggle('lower-centro', t.lowerPos === 'centro');
    }
    if (o.logo) {
      const l = o.logo, img = $('img', logo);
      if (l.url && img.getAttribute('src') !== l.url) img.src = l.url;
      img.style.width = (l.tamanho || 160) + 'px'; logo.style.opacity = '';
      img.style.opacity = (l.opacidade || 85) / 100;
      canto(logo, l.canto); logo.classList.toggle('show', !!(l.visible && l.url));
    }
    if (o.qr) {
      const q = o.qr, img = $('img', qr), tam = q.tamanho || 220;
      if (q.texto && (q.texto !== qrTexto || tam !== qrTam)) { img.src = '/qr.svg?text=' + encodeURIComponent(q.texto); qrTexto = q.texto; qrTam = tam; }
      img.style.width = img.style.height = tam + 'px'; $('.rotulo', qr).textContent = q.rotulo || ''; $('.rotulo', qr).style.maxWidth = tam + 'px';
      canto(qr, q.canto); qr.classList.toggle('show', !!(q.visible && q.texto));
    }
    if (o.relogio) { relogioCfg = o.relogio; canto(relogio, o.relogio.canto); relogio.classList.toggle('show', !!o.relogio.visible); tickRelogio(); }
    if (o.cartao) {
      const c = o.cartao;
      if (c.visible) {
        $('.titulo', cartao).textContent = c.titulo || ''; $('.texto', cartao).textContent = c.texto || '';
        const bg = $('.bg', cartao);
        if (c.imagem) bg.style.background = `url("${c.imagem}") center / cover no-repeat`;
        else bg.style.background = c.cor ? `linear-gradient(135deg, ${c.cor}, #0b0d12 75%)` : '';
        cartao.classList.toggle('long', ((c.titulo || '').length > 40) || ((c.texto || '').length > 160));
      }
      cartao.classList.toggle('show', !!c.visible);
    }
    if (o.lowerThird) {
      const lt = o.lowerThird;
      if (lt.visible) { $('.title', lower).textContent = lt.title || ''; $('.subtitle', lower).textContent = lt.subtitle || ''; }
      lower.classList.toggle('show', !!lt.visible);
    }
    if (o.verse) {
      const v = o.verse;
      if (v.visible) { $('.text', verse).textContent = v.text || ''; $('.ref', verse).textContent = v.ref || ''; verse.classList.toggle('long', (v.text || '').length > 220); }
      verse.classList.toggle('show', !!v.visible);
    }
    if (o.ticker) {
      const t = o.ticker;
      const span = $('.text', ticker);
      if (t.visible && span.textContent !== (t.text || '')) {
        span.textContent = t.text || '';
        const dur = Math.max(12, (t.text || '').length * 0.35);
        span.style.animationDuration = dur + 's';
      }
      ticker.classList.toggle('show', !!t.visible);
    }
    if (o.countdown) { cd = o.countdown; $('.msg', countdown).textContent = cd.message || ''; countdown.classList.toggle('show', !!cd.visible); tick(); }
    if (o.title) { const t = o.title; if (t.visible) $('.text', title).textContent = t.text || ''; title.classList.toggle('show', !!t.visible); }
    if (o.lyrics) {
      const l = o.lyrics, e = l.estilo || {};
      if (l.visible) { $('.text', lyrics).textContent = l.text || ''; $('.title', lyrics).textContent = e.titulo ? (l.title || '') : ''; }
      lyrics.className = [e.posicao === 'superior' ? 'superior' : 'inferior', e.fundo || 'faixa', e.tamanho || 'M',
        e.maiusculas ? 'maiusculas' : '', (l.text || '').length > 150 ? 'long' : '', l.visible ? 'show' : ''].filter(Boolean).join(' ');
    }
    // letra inferior sobe quando a legenda inferior está na tela, para não se sobreporem
    lyrics.classList.toggle('with-lower', lower.classList.contains('show'));
    if (o.legenda) {
      const g = o.legenda;
      if (g.visible) $('.box', legenda).textContent = g.text || '';
      legenda.classList.toggle('long', (g.text || '').length > 90);
      legenda.classList.toggle('show', !!g.visible);
    }
    // a legenda traduzida sobe quando a letra ou a legenda inferior ocupam o rodapé
    legenda.classList.toggle('with-lyrics', lyrics.classList.contains('show') && !lyrics.classList.contains('superior'));
    legenda.classList.toggle('with-lower', lower.classList.contains('show') && !lyrics.classList.contains('show'));
  }

  function tick() {
    if (!cd.visible) return;
    const ms = Math.max(0, (cd.target || 0) - Date.now());
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, '0');
    $('.time', countdown).textContent = h ? `${h}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
  }
  setInterval(tick, 250);
  function tickRelogio() {
    if (!relogioCfg.visible) return;
    const d = new Date(); let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
    if (relogioCfg.formato === '12h') { const ampm = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; relogio.textContent = `${h}:${m} ${ampm}`; }
    else relogio.textContent = `${String(h).padStart(2, '0')}:${m}`;
  }
  setInterval(tickRelogio, 1000);

  new Hub({ role: 'overlay' }, (m) => { if (m.type === 'overlay') apply(m.overlay); });
})();
</script>
</body>
</html>
