<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiview</title>
<link rel="stylesheet" href="/common.css">
<style>
  html, body { height: 100%; margin: 0; background: #000; color: #fff; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #bar { position: fixed; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: rgba(20,22,30,.92); border-bottom: 1px solid #2a2f3d; z-index: 2; font-size: 14px; }
  #bar .brand { font-weight: 700; }
  #bar .badge { font-size: 12px; padding: 3px 9px; }
  #bar .live { background: #ff3b3b; color: #fff; font-weight: 700; animation: pulse 1.6s infinite; }
  #bar .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  #grid { position: absolute; inset: 40px 0 0 0; padding: 8px; display: grid; gap: 8px; grid-auto-rows: 1fr; }
  .tile { position: relative; background: #111; border: 3px solid #2a2f3d; border-radius: 6px; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tile .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 10px; background: rgba(0,0,0,.65); font-size: 14px; display: flex; justify-content: space-between; }
  .tile .name .key { opacity: .6; }
  .tile.program { border-color: #ff3b3b; grid-column: span 2; grid-row: span 2; }
  .tile.program .name { background: rgba(255,59,59,.85); font-weight: 700; }
  .tile.onair { border-color: #ff3b3b; }
  .tile.onair .name::before { content: "● "; color: #ff3b3b; }
  .tile.replay { border-color: #f5a623; }
  .tile .empty { color: #666; font-size: 13px; }
  #msg { position: absolute; inset: 40px 0 0 0; display: grid; place-items: center; color: #aaa; font-size: 18px; }
  @keyframes pulse { 50% { opacity: .55; } }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">🖥️ Multiview</span>
  <span class="badge" id="obsBadge"><span class="dot"></span>OBS</span>
  <span class="badge" id="streamBadge">Fora do ar</span>
  <span class="muted" id="hint">Clique numa cena ou use as teclas 1–9 para cortar</span>
  <span class="clock" id="clock"></span>
</div>
<div id="grid"></div>
<div id="msg">Conectando ao OBS…</div>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  const { Hub, $, el } = window.TI;
  const S = { obs: false, scenes: [], program: '', streaming: false, busy: false };
  const pending = new Map(); let reqId = 1;
  const hub = new Hub({ role: 'mesa', name: 'multiview' }, onMessage, () => {});

  function obs(request, data) {
    return new Promise((resolve, reject) => {
      const id = String(reqId++); pending.set(id, { resolve, reject });
      if (!hub.send({ type: 'obs', id, request, data })) { pending.delete(id); reject(new Error('offline')); }
      setTimeout(() => { if (pending.delete(id)) reject(new Error('sem resposta')); }, 8000);
    });
  }
  function obsBatch(requests) {
    return new Promise((resolve, reject) => {
      const id = String(reqId++); pending.set(id, { resolve, reject });
      if (!hub.send({ type: 'obsBatch', id, requests })) { pending.delete(id); reject(new Error('offline')); }
      setTimeout(() => { if (pending.delete(id)) reject(new Error('sem resposta')); }, 15000);
    });
  }
  function onMessage(m) {
    if (m.type === 'obsResult') { const p = pending.get(m.id); if (!p) return; pending.delete(m.id); m.ok ? p.resolve(m.data) : p.reject(new Error(m.error)); }
    else if (m.type === 'obsStatus') { S.obs = m.connected; badge($('#obsBadge'), m.connected ? 'ok' : 'danger', 'OBS'); $('#msg').style.display = m.connected ? 'none' : ''; $('#msg').textContent = m.connected ? '' : 'OBS desconectado'; if (m.connected) refresh(); }
    else if (m.type === 'obsEvent') onEvent(m.event, m.data);
  }
  function onEvent(ev, d) {
    if (ev === 'CurrentProgramSceneChanged') { S.program = d.sceneName; layout(); }
    if (['SceneListChanged', 'SceneCreated', 'SceneRemoved', 'SceneNameChanged'].includes(ev)) refresh();
    if (ev === 'StreamStateChanged') setStream(d.outputActive);
  }
  function badge(e, cls, label) { e.className = 'badge ' + cls; e.innerHTML = `<span class="dot ${cls}"></span>${label}`; }
  function setStream(on) { S.streaming = on; const b = $('#streamBadge'); b.className = 'badge ' + (on ? 'live' : ''); b.textContent = on ? 'NO AR' : 'Fora do ar'; }

  async function refresh() {
    try {
      const sl = await obs('GetSceneList');
      S.scenes = sl.scenes.map((s) => s.sceneName).reverse().filter((n) => n !== 'Overlay' && !n.startsWith('_'));
      S.program = sl.currentProgramSceneName;
      try { setStream((await obs('GetStreamStatus')).outputActive); } catch { /* ignorar */ }
      layout();
    } catch { /* ignorar */ }
  }

  function layout() {
    const grid = $('#grid'); grid.innerHTML = '';
    const n = S.scenes.length;
    // programa ocupa 2x2; demais cenas em volta
    const cols = Math.max(3, Math.ceil(Math.sqrt(n + 4)));
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.append(el('div', { class: 'tile program', 'data-scene': '__program' }, [el('img', { alt: '' }), el('div', { class: 'name' }, [el('span', { text: 'PROGRAMA · ' + (S.program || '') }), el('span', { class: 'key', text: S.streaming ? 'NO AR' : '' })])]));
    S.scenes.forEach((name, i) => {
      const t = el('div', { class: 'tile' + (name === S.program ? ' onair' : '') + (name === 'Replay' ? ' replay' : ''), 'data-scene': name, onclick: () => obs('SetCurrentProgramScene', { sceneName: name }).catch(() => {}) },
        [el('img', { alt: '' }), el('div', { class: 'name' }, [el('span', { text: name }), el('span', { class: 'key', text: i < 9 ? String(i + 1) : '' })])]);
      grid.append(t);
    });
    for (const [k, v] of Object.entries(cache)) { const t = grid.querySelector(`.tile[data-scene="${CSS.escape(k)}"] img`); if (t) t.src = v; }
  }

  const cache = {};
  async function snap() {
    if (!S.obs || S.busy || !S.scenes.length) return;
    S.busy = true;
    try {
      const reqs = S.scenes.map((name) => ({ request: 'GetSourceScreenshot', data: { sourceName: name, imageFormat: 'jpg', imageWidth: name === S.program ? 768 : 384, imageCompressionQuality: 50 } }));
      const res = await obsBatch(reqs);
      res.forEach((r, i) => {
        if (!r.ok) return;
        const name = S.scenes[i]; cache[name] = r.data.imageData;
        const img = document.querySelector(`.tile[data-scene="${CSS.escape(name)}"] img`); if (img) img.src = r.data.imageData;
        if (name === S.program) { const p = document.querySelector('.tile.program img'); if (p) p.src = r.data.imageData; }
      });
    } catch { /* ignorar */ } finally { S.busy = false; }
  }
  setInterval(snap, 700);

  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '9' && S.scenes[Number(e.key) - 1]) obs('SetCurrentProgramScene', { sceneName: S.scenes[Number(e.key) - 1] }).catch(() => {});
  });
  setInterval(() => { $('#clock').textContent = new Date().toTimeString().slice(0, 8); }, 500);
})();
</script>
</body>
</html>
